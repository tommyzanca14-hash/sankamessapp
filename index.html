<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanka Messaggi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #register-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        #register-screen h2 { margin-bottom: 20px; color: #007bff; }
        #register-screen input { width: 100%; max-width: 300px; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        #register-screen button { width: 100%; max-width: 300px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .content-section { display: none; flex: 1; overflow-y: auto; padding-bottom: 70px; }
        .content-section.active { display: flex; flex-direction: column; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { background: none; border: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #555; }
        .nav-item.active { color: #007bff; }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }

        .chat-header { padding: 15px; background: white; border-bottom: 1px solid #ddd; }
        .chat-header input { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .chat-subbar { display: flex; justify-content: space-between; padding: 10px 15px; background: #fafafa; font-size: 14px; color: #333; border-bottom: 1px solid #eee; }
        .chat-list { flex: 1; overflow-y: auto; background: white; }
        .chat-item { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .chat-item:hover { background: #f9f9f9; }

        #active-chat-window { display: none; flex-direction: column; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e5ddd5; z-index: 1500; }
        .active-chat-header { background: #007bff; color: white; display: flex; align-items: center; padding: 12px 15px; gap: 15px; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .active-chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
        .message-bubble.sent { background: #dcf8c6; align-self: flex-end; }
        .message-bubble.received { background: white; align-self: flex-start; }
        
        .active-chat-input { background: #f0f0f0; display: flex; padding: 10px; gap: 10px; flex-shrink: 0; border-top: 1px solid #ccc; align-items: center; }
        .active-chat-input input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 16px; background: white; }
        .active-chat-input button { padding: 10px 18px; background: #007bff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 14px; }

        .section-header { padding: 15px; background: white; font-size: 18px; font-weight: bold; border-bottom: 1px solid #ddd; }
        .p-15 { padding: 15px; }
    </style>
</head>
<body>

    <div id="register-screen">
        <h2>Benvenuto su Sanka</h2>
        <p style="margin-bottom: 15px; color: #666; font-size: 14px; text-align: center;">Inserisci i tuoi dati per iniziare</p>
        <input type="text" id="reg-name" placeholder="Il tuo Nome">
        <input type="tel" id="reg-phone" placeholder="Numero di Telefono">
        <input type="email" id="reg-email" placeholder="Indirizzo Email">
        <button onclick="registerUser()">Registrati ed entra</button>
    </div>

    <div id="active-chat-window">
        <div class="active-chat-header">
            <button onclick="closeChat()" style="background:none; border:none; color:white; font-size:16px; cursor:pointer;">⬅ Indietro</button>
            <span id="chat-partner-name">Nome Amico</span>
        </div>
        <div class="active-chat-messages" id="messages-box"></div>
        <div class="active-chat-input">
            <input type="text" id="message-input" placeholder="Scrivi un messaggio...">
            <button onclick="sendMessage()">Invia</button>
        </div>
    </div>

    <div id="section-chats" class="content-section active">
        <div class="chat-header">
            <input type="text" id="search-chats" placeholder="Cerca tra le chat...">
        </div>
        <div class="chat-subbar">
            <span id="contacts-count">Contatti memorizzati: 0</span>
            <button onclick="toggleSort()" id="sort-btn" style="background:none; border:none; color:#007bff; cursor:pointer; font-weight:bold;">Ordine Alfabetico</button>
        </div>
        <div class="chat-list" id="chat-list-container"></div>
    </div>

    <div id="section-calls" class="content-section">
        <div class="section-header">Chiamate e Videochiamate</div>
        <div class="p-15"><button style="padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">Avvia Nuova Chiamata</button></div>
    </div>

    <div id="section-add" class="content-section">
        <div class="section-header">Aggiungi Contatto</div>
        <div class="p-15">
            <div style="display: flex; flex-direction: column; gap: 10px; background:white; padding:15px; border-radius:8px; border:1px solid #ddd;">
                <input type="text" id="new-contact-name" placeholder="Nome dell'amico" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <input type="text" id="new-contact-phone" placeholder="Numero di telefono" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <button onclick="addContact()" style="padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Aggiungi alla rubrica</button>
            </div>
        </div>
    </div>

    <div id="section-social" class="content-section">
        <div class="section-header">Social & Storie</div>
        <div class="p-15"><p>Feed post e storie.</p></div>
    </div>

    <div id="section-profile" class="content-section">
        <div class="section-header">Il Mio Profilo</div>
        <div class="p-15"><p id="profile-info">Nome: - | Tel: -</p></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('chats', this)"><span>💬</span>Chat</button>
        <button class="nav-item" onclick="switchTab('calls', this)"><span>📞</span>Chiamate</button>
        <button class="nav-item" onclick="switchTab('add', this)"><span>➕</span>Aggiungi</button>
        <button class="nav-item" onclick="switchTab('social', this)"><span>🌐</span>Social</button>
        <button class="nav-item" onclick="switchTab('profile', this)"><span>👤</span>Profilo</button>
    </nav>

    <script>
        const socket = io();
        let currentUser = null;
        let contacts = [];
        let messages = [];
        let currentChatContact = null;
        let isAlphabetical = false;

        window.onload = () => {
            const savedUser = localStorage.getItem('sanka_user');
            if(savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('profile-info').innerText = `Nome: ${currentUser.name} | Tel: ${currentUser.phone} | Email: ${currentUser.email}`;
                document.getElementById('register-screen').style.display = 'none';
                socket.emit('get_initial_data', currentUser.phone);
            }
        };

        socket.on('initial_data', (data) => {
            contacts = data.contacts || [];
            messages = data.messages || [];
            updateContactsDisplay();
        });

        socket.on('update_contacts', (newContacts) => {
            contacts = newContacts;
            updateContactsDisplay();
        });

        socket.on('receive_message', (msg) => {
            messages.push(msg);
            if(currentChatContact && (msg.senderPhone === currentChatContact.phone || msg.receiverPhone === currentChatContact.phone)) {
                renderMessages();
            }
        });

        function registerUser() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;

            if(!name || !phone || !email) {
                alert('Compila tutti i campi.');
                return;
            }

            currentUser = { name, phone, email };
            localStorage.setItem('sanka_user', JSON.stringify(currentUser));
            socket.emit('register_user', currentUser);
            
            document.getElementById('profile-info').innerText = `Nome: ${name} | Tel: ${phone} | Email: ${email}`;
            document.getElementById('register-screen').style.display = 'none';
            socket.emit('get_initial_data', currentUser.phone);
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById('section-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        function addContact() {
            const name = document.getElementById('new-contact-name').value;
            const phone = document.getElementById('new-contact-phone'].value; // Corretto
            if(!name || !phone) return;

            const contactData = { ownerPhone: currentUser.phone, name, phone };
            socket.emit('add_contact', contactData);

            document.getElementById('new-contact-name').value = '';
            document.getElementById('new-contact-phone').value = '';
            switchTab('chats', document.querySelectorAll('.nav-item')[0]);
        }

        function updateContactsDisplay() {
            const container = document.getElementById('chat-list-container');
            document.getElementById('contacts-count').innerText = `Contatti memorizzati: ${contacts.length}`;
            
            if(contacts.length === 0) {
                container.innerHTML = '<div class="chat-item">Nessuna chat attiva. Aggiungi un amico dal tasto [+]</div>';
                return;
            }

            let displayList = [...contacts];
            if(isAlphabetical) {
                displayList.sort((a, b) => a.name.localeCompare(b.name));
            }

            container.innerHTML = '';
            displayList.forEach(contact => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `<span><b>${contact.name}</b> (${contact.phone})</span> <span style="color:#007bff; font-size:12px;">Scrivi ➡</span>`;
                div.onclick = () => openChat(contact);
                container.appendChild(div);
            });
        }

        function toggleSort() {
            isAlphabetical = !isAlphabetical;
            document.getElementById('sort-btn').innerText = isAlphabetical ? "Ordine Cronologico" : "Ordine Alfabetico";
            updateContactsDisplay();
        }

        function openChat(contact) {
            currentChatContact = contact;
            document.getElementById('chat-partner-name').innerText = contact.name;
            renderMessages();
            document.getElementById('active-chat-window').style.display = 'flex';
        }

        function closeChat() {
            document.getElementById('active-chat-window').style.display = 'none';
            currentChatContact = null;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text || !currentChatContact || !currentUser) return;

            const msgData = {
                senderPhone: currentUser.phone,
                receiverPhone: currentChatContact.phone,
                text: text
            };

            socket.emit('send_message', msgData);
            input.value = '';
        }

        function renderMessages() {
            const box = document.getElementById('messages-box');
            box.innerHTML = '';
            if(!currentChatContact || !currentUser) return;

            const chatMessages = messages.filter(m => 
                (m.senderPhone === currentUser.phone && m.receiverPhone === currentChatContact.phone) ||
                (m.senderPhone === currentChatContact.phone && m.receiverPhone === currentUser.phone)
            );

            chatMessages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble ' + (msg.senderPhone === currentUser.phone ? 'sent' : 'received');
                bubble.innerText = msg.text;
                box.appendChild(bubble);
            });
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
